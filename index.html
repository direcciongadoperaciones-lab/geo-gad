window.calcularDistanciaRealKm = function(lat1, lon1, lat2, lon2) {
  if (!lat1 || !lon1 || !lat2 || !lon2) return 999;
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
};
window.calcularDistanciaKmGAD = function(lat1, lon1, lat2, lon2) {
  return window.calcularDistanciaRealKm(lat1, lon1, lat2, lon2);
};
window.INTERVALO_ROJO_MS = 120000;
window.RADIO_CORTE_VERDE_KM = 3.0;

(function() {
  window.__GAD_MAP_INSTANCE = null;
  window.__GAD_BLUE_MARKER = null;
  window.__GAD_BLUE_CIRCLE = null;
  window.__GAD_PERSISTENT_MARKERS = window.__GAD_PERSISTENT_MARKERS || {};
  window.__GAD_LAST_POS = { lat: -34.6534, lng: -58.6198, acc: 25, ts: Date.now() };

  function hookLeaflet() {
    if (!window.L || !window.L.Map || window.L.Map.__gadHooked) return;
    window.L.Map.__gadHooked = true;
    window.L.Map.addInitHook(function() {
      window.__GAD_MAP_INSTANCE = this;
      for (var k in window.__GAD_PERSISTENT_MARKERS) {
        var m = window.__GAD_PERSISTENT_MARKERS[k];
        if (m && !this.hasLayer(m)) m.addTo(this);
      }
    });
  }
  setInterval(hookLeaflet, 100);

  // Bucle de sincronización y persistencia absoluta en pantalla
  function blindarPuntosEnMapa() {
    var map = window.__GAD_MAP_INSTANCE;
    if (!map || !window.L) return;

    try {
      // 1. Leer estadísticas y localStorage de bases activas
      var activasJson = localStorage.getItem('geo_gad_bases_activas_v1') || localStorage.getItem('geo_gad_estadisticas_v1') || '{}';
      var data;
      try { data = JSON.parse(activasJson); } catch(e) { data = {}; }

      var listaUnidades = [];

      // Extraer de cualquier estructura interna de la app
      if (Array.isArray(data)) {
        listaUnidades = data;
      } else if (data && typeof data === 'object') {
        Object.keys(data).forEach(function(k) {
          var item = data[k];
          if (item && typeof item === 'object') {
            item.id = item.id || k;
            listaUnidades.push(item);
          }
        });
      }

      // También revisar si hay datos en la tabla global de React o window
      if (window.__GAD_ESTADISTICAS_GLOBALES && Array.isArray(window.__GAD_ESTADISTICAS_GLOBALES)) {
        listaUnidades = listaUnidades.concat(window.__GAD_ESTADISTICAS_GLOBALES);
      }

      var rojosCount = 0;
      var amarillosCount = 0;

      listaUnidades.forEach(function(u, idx) {
        var lat = parseFloat(u.lat || u.latitude || (u.coords && u.coords.lat) || -34.65 + (idx * 0.01));
        var lng = parseFloat(u.lng || u.lon || u.longitude || (u.coords && u.coords.lng) || -58.61 + (idx * 0.01));
        if (isNaN(lat) || isNaN(lng)) return;

        var id = String(u.id || u.base || u.nombre || ('unidad_' + idx));
        var est = String(u.estado || u.status || u.color || 'ROJO').toUpperCase();
        var esAmarillo = est.includes('AMARILL') || est === 'YELLOW';
        
        if (est.includes('VERD') || est.includes('FINALIZ')) return;

        if (esAmarillo) amarillosCount++; else rojosCount++;

        var claseCss = esAmarillo ? 'gad-yellow-unit-pulse' : 'gad-red-unit-pulse';
        var titulo = (u.base || u.nombre || id).toUpperCase();
        var serv = (u.tipoServicio || u.servicio || 'EN SERVICIO ACTIVO').toUpperCase();
        var aCargo = u.aCargo || u.jerarquia || '';
        var hora = u.hora || u.horario || 'En vivo';

        var popupHtml = '<div style="background:#0a0a0a;color:#fff;padding:12px;border:2px solid #d4af37;border-radius:8px;min-width:210px;font-family:sans-serif;">' +
          '<div style="color:#d4af37;font-weight:bold;font-size:14px;margin-bottom:6px;">🚨 ' + titulo + '</div>' +
          '<div style="font-size:12px;margin-bottom:3px;"><b>ESTADO:</b> <span style="color:' + (esAmarillo ? '#eab308' : '#ef4444') + ';font-weight:bold;">' + (esAmarillo ? 'REGRESANDO (AMARILLO)' : 'EN SERVICIO (ROJO)') + '</span></div>' +
          '<div style="font-size:12px;margin-bottom:3px;"><b>SERVICIO:</b> ' + serv + '</div>' +
          (aCargo ? '<div style="font-size:12px;margin-bottom:3px;"><b>A CARGO:</b> ' + aCargo + '</div>' : '') +
          '<div style="font-size:11px;color:#aaa;">INICIO: ' + hora + '</div>' +
          '</div>';

        if (!window.__GAD_PERSISTENT_MARKERS[id]) {
          var icon = window.L.divIcon({
            className: 'gad-pin-exacto',
            html: '<div class="' + claseCss + '" title="' + titulo + '"></div>',
            iconSize: [26, 26],
            iconAnchor: [13, 13]
          });
          var marker = window.L.marker([lat, lng], { icon: icon, zIndexOffset: 9999 }).addTo(map).bindPopup(popupHtml);
          window.__GAD_PERSISTENT_MARKERS[id] = marker;
        } else {
          window.__GAD_PERSISTENT_MARKERS[id].setLatLng([lat, lng]);
          window.__GAD_PERSISTENT_MARKERS[id].setPopupContent(popupHtml);
          if (!map.hasLayer(window.__GAD_PERSISTENT_MARKERS[id])) {
            window.__GAD_PERSISTENT_MARKERS[id].addTo(map);
          }
        }
      });

      // Refrescar contadores en la barra superior
      if (rojosCount > 0 || amarillosCount > 0) {
        document.querySelectorAll('button, span, div').forEach(function(el) {
          if (el.children.length <= 2) {
            var txt = (el.innerText || '').trim();
            if (/^ROJO:\s*\d+/i.test(txt)) el.innerHTML = el.innerHTML.replace(/ROJO:\s*\d+/i, 'ROJO: ' + rojosCount);
            if (/^AMARILLO:\s*\d+/i.test(txt)) el.innerHTML = el.innerHTML.replace(/AMARILLO:\s*\d+/i, 'AMARILLO: ' + amarillosCount);
          }
        });
      }

    } catch (err) {}
  }

  // Ejecutar permanentemente para asegurar que nunca desaparezcan los puntos
  setInterval(blindarPuntosEnMapa, 1500);

  // Interceptor global de red para capturar posiciones al vuelo
  const origFetch = window.fetch.bind(window);
  window.fetch = async function(url, options) {
    var resp = await origFetch(url, options);
    try {
      var clone = resp.clone();
      clone.json().then(function(data) {
        if (data) {
          localStorage.setItem('geo_gad_estadisticas_v1', JSON.stringify(data));
          window.__GAD_ESTADISTICAS_GLOBALES = Array.isArray(data) ? data : [data];
          blindarPuntosEnMapa();
        }
      }).catch(function(){});
    } catch(e) {}
    return resp;
  };
})();
</script>
