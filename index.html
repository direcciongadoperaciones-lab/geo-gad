<!DOCTYPE html>
<html lang="es">
<head>
<meta name="color-scheme" content="only light" />
<meta name="supported-color-schemes" content="light" />

<title>GEO-GAD | División Operaciones</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.tailwindcss.com"></script>
<style id="gad-shield-protection">
:root, html, body {
  color-scheme: only light !important;
  forced-color-adjust: none !important;
  -webkit-forced-color-adjust: none !important;
}
.leaflet-marker-icon, .leaflet-marker-icon svg, .custom-gad-shield, .custom-gad-shield svg, .leaflet-pane svg {
  color-scheme: only light !important;
  forced-color-adjust: none !important;
  -webkit-forced-color-adjust: none !important;
  filter: drop-shadow(0 3px 6px rgba(0,0,0,0.95)) !important;
  -webkit-filter: drop-shadow(0 3px 6px rgba(0,0,0,0.95)) !important;
}
.gad-red-unit-pulse {
  width: 28px; height: 28px; background-color: #ef4444; border: 3px solid #ffffff; border-radius: 50%;
  box-shadow: 0 0 0 12px rgba(239, 68, 68, 0.75), 0 0 22px #000000;
  animation: gadPulseRed 1.2s infinite;
}
.gad-yellow-unit-pulse {
  width: 28px; height: 28px; background-color: #eab308; border: 3px solid #000000; border-radius: 50%;
  box-shadow: 0 0 0 12px rgba(234, 179, 8, 0.75), 0 0 22px #000000;
}
@keyframes gadPulseRed {
  0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.95); transform: scale(1); }
  70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); transform: scale(1.15); }
  100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); transform: scale(1); }
}
.gad-pin-exacto { background: transparent !important; border: 0 !important; margin: 0 !important; padding: 0 !important; }
</style>
<script id="gad-motor-definitivo-v151">
(function() {
  window.__GAD_MAP_INSTANCE = null;
  window.__GAD_MAP_MARKERS = window.__GAD_MAP_MARKERS || {};

  function vincularMapa() {
    if (!window.L || !window.L.Map || window.L.Map.__gadHooked) return;
    window.L.Map.__gadHooked = true;
    window.L.Map.addInitHook(function() {
      window.__GAD_MAP_INSTANCE = this;
    });
  }
  setInterval(vincularMapa, 150);

  function renderizarPuntosYContadores() {
    var map = window.__GAD_MAP_INSTANCE;
    if (!map || !window.L) return;

    try {
      var raw = localStorage.getItem('geo_gad_bases_activas_v1') || localStorage.getItem('geo_gad_estadisticas_v1') || '{}';
      var data;
      try { data = JSON.parse(raw); } catch(e) { data = {}; }

      var unidades = [];
      if (Array.isArray(data)) {
        unidades = data;
      } else if (data && typeof data === 'object') {
        Object.keys(data).forEach(function(k) {
          var item = data[k];
          if (item && typeof item === 'object') {
            item.id = item.id || k;
            unidades.push(item);
          }
        });
      }

      var rojos = 0;
      var amarillos = 0;

      unidades.forEach(function(u, idx) {
        var lat = parseFloat(u.lat || u.latitude || (u.coords && u.coords.lat));
        var lng = parseFloat(u.lng || u.lon || u.longitude || (u.coords && u.coords.lng));
        if (isNaN(lat) || isNaN(lng)) return;

        var id = String(u.id || u.base || u.nombre || ('u_' + idx));
        var est = String(u.estado || u.status || u.color || 'ROJO').toUpperCase();
        var esAmarillo = est.includes('AMARILL') || est === 'YELLOW' || est.includes('REPLIEG');

        if (est.includes('VERD') || est.includes('FINALIZ')) return;

        if (esAmarillo) amarillos++; else rojos++;

        var claseCss = esAmarillo ? 'gad-yellow-unit-pulse' : 'gad-red-unit-pulse';
        var nombreBase = (u.base || u.nombre || id).toUpperCase();
        var servicioTxt = (u.tipoServicio || u.servicio || 'EN SERVICIO ACTIVO').toUpperCase();
        var aCargoTxt = u.aCargo || u.jerarquia || '';

        var htmlPopup = '<div style="background:#0a0a0a;color:#fff;padding:12px;border:2px solid #d4af37;border-radius:8px;min-width:210px;font-family:sans-serif;">' +
          '<div style="color:#d4af37;font-weight:bold;font-size:14px;margin-bottom:6px;">🚨 ' + nombreBase + '</div>' +
          '<div style="font-size:12px;margin-bottom:3px;"><b>ESTADO:</b> <span style="color:' + (esAmarillo ? '#eab308' : '#ef4444') + ';font-weight:bold;">' + (esAmarillo ? 'EN REPLIEGUE (AMARILLO)' : 'EN SERVICIO (ROJO)') + '</span></div>' +
          '<div style="font-size:12px;margin-bottom:3px;"><b>SERVICIO:</b> ' + servicioTxt + '</div>' +
          (aCargoTxt ? '<div style="font-size:12px;"><b>A CARGO:</b> ' + aCargoTxt + '</div>' : '') +
          '</div>';

        if (!window.__GAD_MAP_MARKERS[id]) {
          var icon = window.L.divIcon({
            className: 'gad-pin-exacto',
            html: '<div class="' + claseCss + '" title="' + nombreBase + '"></div>',
            iconSize: [28, 28],
            iconAnchor: [14, 14]
          });
          var marker = window.L.marker([lat, lng], { icon: icon, zIndexOffset: 9999 }).addTo(map).bindPopup(htmlPopup);
          window.__GAD_MAP_MARKERS[id] = marker;
        } else {
          window.__GAD_MAP_MARKERS[id].setLatLng([lat, lng]);
          window.__GAD_MAP_MARKERS[id].setPopupContent(htmlPopup);
          if (!map.hasLayer(window.__GAD_MAP_MARKERS[id])) {
            window.__GAD_MAP_MARKERS[id].addTo(map);
          }
        }
      });

      // Sincronizar contadores superiores de la barra
      if (rojos > 0 || amarillos > 0) {
        document.querySelectorAll('button, span, div').forEach(function(el) {
          if (el.children.length <= 2) {
            var t = (el.innerText || '').trim();
            if (/^ROJO:\s*\d+/i.test(t)) el.innerHTML = el.innerHTML.replace(/ROJO:\s*\d+/i, 'ROJO: ' + rojos);
            if (/^AMARILLO:\s*\d+/i.test(t)) el.innerHTML = el.innerHTML.replace(/AMARILLO:\s*\d+/i, 'AMARILLO: ' + amarillos);
          }
        });
      }
    } catch (e) {}
  }

  setInterval(renderizarPuntosYContadores, 1000);

  // Interceptar red para mantener estadísticas seguras y reflejar en vivo
  const origFetch = window.fetch.bind(window);
  window.fetch = async function(url, options) {
    var resp = await origFetch(url, options);
    try {
      var clone = resp.clone();
      clone.json().then(function(data) {
        if (data) {
          localStorage.setItem('geo_gad_bases_activas_v1', JSON.stringify(data));
          renderizarPuntosYContadores();
        }
      }).catch(function(){});
    } catch(e) {}
    return resp;
  };
})();
</script>
