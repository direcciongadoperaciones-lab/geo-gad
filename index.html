// Cálculo exacto Haversine en KM
window.calcularDistanciaRealKm = function(lat1, lon1, lat2, lon2) {
  if (!lat1 || !lon1 || !lat2 || !lon2) return 999;
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
};

// REGLA DE ORO DEL OFICIAL PRINCIPAL:
// Solo permite el auto-corte a VERDE si está a menos de 3 KM **Y** lleva más de 30 minutos estacionado sin moverse (>200m).
window.__GAD_STATIONARY_TRACKER = {};
window.calcularDistanciaKmGAD = function(lat1, lon1, lat2, lon2) {
  const distKm = window.calcularDistanciaRealKm(lat1, lon1, lat2, lon2);
  if (distKm > 3.0) return distKm; // Está fuera de los 3km -> Sigue ROJO/AMARILLO normal

  // Está dentro de los 3km: verificar si lleva más de 30 minutos estacionado
  const key = Number(lat2).toFixed(3) + "_" + Number(lon2).toFixed(3);
  const ahora = Date.now();
  const reg = window.__GAD_STATIONARY_TRACKER[key];

  if (!reg) {
    window.__GAD_STATIONARY_TRACKER[key] = { lat: lat1, lon: lon1, quietoDesde: ahora };
    return 99.0; // Recién detectado, devolver >3km para que NO lo corte a verde
  }

  const movMetros = window.calcularDistanciaRealKm(reg.lat, reg.lon, lat1, lon1) * 1000;
  if (movMetros >= 200) {
    // Se movió más de 200 metros: reinicia el reloj de estacionado
    window.__GAD_STATIONARY_TRACKER[key] = { lat: lat1, lon: lon1, quietoDesde: ahora };
    return 99.0;
  }

  const minutosQuieto = (ahora - reg.quietoDesde) / 60000;
  if (minutosQuieto >= 30) {
    return distKm; // Cumplió 30 min estacionado a <3km de la base -> Permite corte a VERDE
  }

  return 99.0; // Sigue en servicio activo en ROJO aunque esté a menos de 3km
};

// Ajustado para no superar el 50% del plan gratis de Cloudflare en el peor escenario 24hs
window.INTERVALO_ROJO_MS = 120000; // 2 minutos allanamiento

(function() {
  window.__GAD_MAP_INSTANCE = null;
  window.__GAD_BLUE_MARKER = null;
  window.__GAD_BLUE_CIRCLE = null;
  window.__GAD_LIVE_MARKERS = {};
  window.__GAD_LAST_POS = { lat: -34.6534, lng: -58.6198, acc: 25, ts: Date.now() };

  // 1. Capturar instancia real del mapa Leaflet
  function hookLeaflet() {
    if (!window.L || !window.L.Map || window.L.Map.__gadHooked) return;
    window.L.Map.__gadHooked = true;

  var ultimaPosEnviada = null;
  var quietoInicioTs = null;
  var ultimoReporteTs = 0;

  function obtenerIntervaloSegunServicio(tipoServicio, ahora) {
    var s = (tipoServicio || '').toUpperCase();
    var intervaloBase = 120000; // Por defecto 2 min (Allanamiento conurbano)
    if (s.includes('ALLANAMIENTO') && s.includes('INTERIOR')) intervaloBase = 600000; // 10 min
    else if (s.includes('ALLANAMIENTO')) intervaloBase = 120000; // 2 min
    else if (s.includes('BAJADA') && s.includes('INTERIOR')) intervaloBase = 900000; // 15 min
    else if (s.includes('BAJADA')) intervaloBase = 300000; // 5 min
    else if (s.includes('MANIFESTAC')) intervaloBase = 600000; // 10 min
    else if (s.includes('SATURAC')) intervaloBase = 3600000; // 1 hora
    else if (s.includes('CALABOZO') || s.includes('GENERAL') || s.includes('PREVENC')) intervaloBase = 1800000; // 30 min

    // Regla móvil estacionado (<200m): primeros 30 min reporta cada 10 min, luego cada 1 hora
    if (quietoInicioTs) {
      var minQuieto = (ahora - quietoInicioTs) / 60000;
      if (minQuieto >= 30) return 3600000; // 1 hora
      if (minQuieto >= 3) return Math.max(intervaloBase, 600000); // 10 min
    }

      return {
        coords: {
          latitude: window.__GAD_LAST_POS.lat,
          longitude: window.__GAD_LAST_POS.lng,
          accuracy: window.__GAD_LAST_POS.acc || 25

        timestamp: Date.now()
      };
    }

    navigator.geolocation.getCurrentPosition = function(success, error) {
      var respondido = false;
      var t = setTimeout(function() {
        if (!respondido) { respondido = true; if (success) success(crearRespaldo()); }

      origGetCurrent(function(pos) {
        if (respondido) return;
        respondido = true; clearTimeout(t);
        guardarPosLocal(pos);
        if (success) success(pos);
      }, function() {
        origGetCurrent(function(pos2) {
          if (respondido) return;
          respondido = true; clearTimeout(t);
          guardarPosLocal(pos2);
          if (success) success(pos2);
        }, function() {
          if (respondido) return;
          respondido = true; clearTimeout(t);
          if (success) success(crearRespaldo());
        }, { enableHighAccuracy: false, timeout: 2000, maximumAge: 120000 });
      }, { enableHighAccuracy: true, timeout: 2000, maximumAge: 5000 });
    };

    navigator.geolocation.watchPosition = function(success, error, options) {
      setTimeout(function() { navigator.geolocation.getCurrentPosition(success, error); }, 80);
      return origWatch(function(pos) {
        var ahora = Date.now();
        var lat = pos.coords.latitude;
        var lng = pos.coords.longitude;

        if (ultimaPosEnviada) {
          var distMetros = window.calcularDistanciaRealKm(ultimaPosEnviada.lat, ultimaPosEnviada.lng, lat, lng) * 1000;
          if (distMetros >= 200) {
            // Se movió 200m: reactiva reporte inmediato
            quietoInicioTs = null;
            ultimaPosEnviada = { lat: lat, lng: lng };
            ultimoReporteTs = ahora;
            guardarPosLocal(pos);
            if (success) success(pos);
            return;
          } else if (!quietoInicioTs) {
            quietoInicioTs = ahora;
          }
        } else {
          ultimaPosEnviada = { lat: lat, lng: lng };
        }

        var intervalo = obtenerIntervaloSegunServicio(localStorage.getItem('geo_gad_tipo_servicio_activo'), ahora);
        if (ahora - ultimoReporteTs >= intervalo) {
          ultimoReporteTs = ahora;
          guardarPosLocal(pos);
          if (success) success(pos);
        }

    };
  }

  function guardarPosLocal(pos) {
    if (!pos || !pos.coords) return;
    window.__GAD_LAST_POS = {
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      acc: pos.coords.accuracy || 25,
      ts: Date.now()

    localStorage.setItem('geo_gad_last_efectivo_coords', JSON.stringify(window.__GAD_LAST_POS));
    dibujarPuntitoAzul(window.__GAD_LAST_POS.lat, window.__GAD_LAST_POS.lng, window.__GAD_LAST_POS.acc, false);

  function dibujarPuntitoAzul(lat, lng, accuracy, centrar) {
    var map = window.__GAD_MAP_INSTANCE;
    if (!map || !window.L) return;
    var latlng = [lat, lng];
    if (!window.__GAD_BLUE_MARKER) {
      var icon = window.L.divIcon({
        className: 'gad-pin-exacto',
        html: '<div class="gad-blue-dot-pulse"></div>',
        iconSize: [18, 18],
        iconAnchor: [9, 9]

        radius: Math.min(accuracy || 30, 150),
        color: '#3b82f6',
        fillColor: '#3b82f6',
        fillOpacity: 0.15,
        weight: 1
      }).addTo(map);
    } else {
      window.__GAD_BLUE_MARKER.setLatLng(latlng);
      if (!map.hasLayer(window.__GAD_BLUE_MARKER)) window.__GAD_BLUE_MARKER.addTo(map);
      if (window.__GAD_BLUE_CIRCLE) {
        window.__GAD_BLUE_CIRCLE.setLatLng(latlng);
        window.__GAD_BLUE_CIRCLE.setRadius(Math.min(accuracy || 30, 150));

  // 3. INTERCEPTOR QUIRÚRGICO DE RED (Cloudflare Free Tier Guard + Forzado de ROJO/AMARILLO en el Mapa)
  const origFetch = window.fetch.bind(window);
  var ultimaRespuestaCache = null;
  var ultimoFetchGetTs = 0;

  window.fetch = async function(url, options) {
    var urlStr = (typeof url === 'string') ? url : (url && url.url ? url.url : '');
    var metodo = (options && options.method) ? options.method.toUpperCase() : 'GET';

    // A) Si el celular está ENVIANDO un inicio de servicio o reporte GPS (POST/PUT)
    if ((metodo === 'POST' || metodo === 'PUT') && options && options.body) {
      try {
        var bodyObj = JSON.parse(options.body);
        if (bodyObj && typeof bodyObj === 'object') {
          // Asegurar que SIEMPRE lleve coordenadas válidas del efectivo
          if (!bodyObj.lat || !bodyObj.lng) {
            bodyObj.lat = window.__GAD_LAST_POS.lat;
            bodyObj.lng = window.__GAD_LAST_POS.lng;
          }
          if (!bodyObj.estado && !bodyObj.status) {
            bodyObj.estado = 'ROJO';
            bodyObj.status = 'ROJO';
          }
          options.body = JSON.stringify(bodyObj);
        }
      } catch (e) {}
    }

    // B) Protección de límite gratuito Cloudflare en lecturas repetidas (<25 seg)
    var ahora = Date.now();
    if (metodo === 'GET' && (urlStr.includes('/api/') || urlStr.includes('sync') || urlStr.includes('bases') || urlStr.includes('state'))) {
      if (ultimaRespuestaCache && (ahora - ultimoFetchGetTs < 25000)) {
        return new Response(JSON.stringify(ultimaRespuestaCache), {
          status: 200,
          headers: { 'Content-Type': 'application/json' }
        });
      }
    }

    const response = await origFetch(url, options);

    // C) Al recibir datos del servidor en el mapa, sincronizar y dibujar puntos ROJOS/AMARILLOS activos
    if (metodo === 'GET' && (urlStr.includes('/api/') || urlStr.includes('sync') || urlStr.includes('bases') || urlStr.includes('state'))) {
      try {
        const clone = response.clone();
        const data = await clone.json();
        if (data) {
          ultimaRespuestaCache = normalizarYRenderizarUnidadesActivas(data);
          ultimoFetchGetTs = Date.now();
          return new Response(JSON.stringify(ultimaRespuestaCache), {
            status: response.status,
            headers: { 'Content-Type': 'application/json' }
          });
        }
      } catch (e) {}
    }

    return response;
  };

  // 4. Normalizar datos y pintar los móviles ROJOS y AMARILLOS en el mapa + contadores
  function normalizarYRenderizarUnidadesActivas(data) {
    try {
      var unidadesRojo = 0;
      var unidadesAmarillo = 0;
      var listaActivas = [];

      // Extraer servicios activos de cualquier estructura que mande el backend
      var fuentes = [];
      if (Array.isArray(data)) fuentes = data;
      else if (data && typeof data === 'object') {
        if (Array.isArray(data.bases)) fuentes = fuentes.concat(data.bases);
        if (Array.isArray(data.servicios)) fuentes = fuentes.concat(data.servicios);
        if (Array.isArray(data.estadisticas)) fuentes = fuentes.concat(data.estadisticas);
        if (data.basesActivas && typeof data.basesActivas === 'object') {
          Object.keys(data.basesActivas).forEach(function(k) {
            var item = data.basesActivas[k];
            if (item && typeof item === 'object') {
              item.id = item.id || k;
              fuentes.push(item);
            }
          });
        }
        Object.keys(data).forEach(function(k) {
          if (data[k] && typeof data[k] === 'object' && (data[k].estado || data[k].status || data[k].servicio || data[k].tipoServicio)) {
            var item = data[k];
            item.id = item.id || k;
            fuentes.push(item);
          }
        });
      }

      fuentes.forEach(function(u) {
        if (!u || typeof u !== 'object') return;
        var est = String(u.estado || u.status || u.color || '').toUpperCase();
        var tieneServicio = Boolean(u.enServicio || u.activo || u.tipoServicio || u.servicio || u.dgado || u.orden);

        if (est.includes('ROJ') || est === 'RED' || est.includes('ACTIVO') || (tieneServicio && !est.includes('VERD') && !est.includes('FINALIZ'))) {
          u.estado = 'ROJO';
          u.status = 'ROJO';
          u.color = 'ROJO';
          u.enServicio = true;
          unidadesRojo++;
          listaActivas.push(u);
        } else if (est.includes('AMARILL') || est === 'YELLOW' || est.includes('REPLIEG')) {
          u.estado = 'AMARILLO';
          u.status = 'AMARILLO';
          u.color = 'AMARILLO';
          unidadesAmarillo++;
          listaActivas.push(u);
        }
      });

      // Actualizar contadores superiores (ROJO: X | AMARILLO: X) en la barra si React los dejó en 0
      setTimeout(function() {
        actualizarContadoresBarra(unidadesRojo, unidadesAmarillo);
        dibujarUnidadesEnMapa(listaActivas);
      }, 100);

    } catch (e) {}
    return data;
  }

  function actualizarContadoresBarra(rojos, amarillos) {
    if (rojos === 0 && amarillos === 0) return;
    var botones = document.querySelectorAll('button, span, div');
    botones.forEach(function(el) {
      if (el.children.length <= 2) {
        var t = (el.innerText || '').trim();

      var clase = esAmarillo ? 'gad-yellow-unit-pulse' : 'gad-red-unit-pulse';
      var titulo = (u.base || u.nombre || id).toUpperCase();
      var serv = (u.tipoServicio || u.servicio || 'EN SERVICIO ACTIVO').toUpperCase();

      var tel = u.telefono || u.contacto || '';

      var popupHtml = '<div style="background:#0a0a0a;color:#fff;padding:10px;border:2px solid #d4af37;border-radius:8px;min-width:200px;font-family:sans-serif;">' +
        '<div style="color:#d4af37;font-weight:bold;font-size:14px;margin-bottom:4px;">🚨 ' + titulo + '</div>' +
        '<div style="font-size:12px;margin-bottom:2px;"><b>ESTADO:</b> <span style="color:' + (esAmarillo ? '#eab308' : '#ef4444') + ';font-weight:bold;">' + u.estado + '</span></div>' +
        '<div style="font-size:12px;margin-bottom:2px;"><b>SERVICIO:</b> ' + serv + '</div>' +
        (aCargo ? '<div style="font-size:12px;margin-bottom:2px;"><b>A CARGO:</b> ' + aCargo + '</div>' : '') +
        (tel ? '<div style="font-size:12px;"><b>TEL:</b> ' + tel + '</div>' : '') +
        '</div>';

      if (!window.__GAD_LIVE_MARKERS[id]) {
        var icon = window.L.divIcon({

        window.__GAD_LIVE_MARKERS[id] = window.L.marker([lat, lng], { icon: icon, zIndexOffset: 9500 })

      } else {
        window.__GAD_LIVE_MARKERS[id].setLatLng([lat, lng]);
        window.__GAD_LIVE_MARKERS[id].setPopupContent(popupHtml);

  }

  // 5. Botón "Mi Ubicación" y rescate GPS inmediato
  document.addEventListener('click', function(e) {
    var btn = e.target.closest('button, a, [role="button"]');
    if (!btn) return;
    var txt = (btn.innerText || btn.title || btn.getAttribute('aria-label') || '').toLowerCase();
    var tieneIconoGps = btn.querySelector('svg.lucide-locate, svg.lucide-locate-fixed, svg.lucide-navigation, svg.lucide-crosshair, svg.lucide-map-pin');
    if (txt.includes('ubicaci') || txt.includes('centrar') || txt.includes('gps') || txt.includes('rescate') || tieneIconoGps) {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) {
          guardarPosLocal(pos);
